name: CI — Lint, Unit Tests & Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same branch/PR to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: PEP 8 lint — fast, no heavy deps
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 src/ tests/ \
            --max-line-length=100 \
            --ignore=E501,W503,E302,E303,W291,W293,F401,E128

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Unit tests — lightweight deps only (no torch / sentence-transformers)
  # Covers: data_adapter, collaborative model, NLP engine
  # Runs in < 2 minutes so every PR gets fast feedback.
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (fast)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lightweight dependencies
        run: |
          pip install --upgrade pip
          pip install \
            "pandas>=2.0.0,<3.0.0" \
            "numpy>=1.24.0,<2.0.0" \
            "scikit-learn>=1.3.0,<2.0.0" \
            "scipy>=1.11.0,<2.0.0" \
            "nltk>=3.8.0,<4.0.0" \
            pytest \
            pytest-env

      - name: Download NLTK VADER lexicon
        run: python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"

      - name: Run unit tests
        env:
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_ANON_KEY: "placeholder"
          SUPABASE_SERVICE_KEY: "placeholder"
          TESTING: "true"
        run: |
          pytest \
            tests/test_data_adapter.py \
            tests/test_collaborative.py \
            tests/test_nlp_engine.py \
            -v --tb=short

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Integration tests — full deps including sentence-transformers
  # Covers: content-based model, hybrid model (all components together)
  # Runs after unit tests pass to avoid wasting CI minutes on model downloads
  # when basic logic is already broken.
  # ──────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (full models)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install all project dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-env

      - name: Download NLTK VADER lexicon
        run: python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"

      - name: Run integration tests
        env:
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_ANON_KEY: "placeholder"
          SUPABASE_SERVICE_KEY: "placeholder"
          REDIS_URL: "redis://localhost:6379/0"
          DATA_PATH: "data/products.csv"
          TESTING: "true"
        run: |
          pytest \
            tests/test_content_based.py \
            tests/test_models.py \
            tests/test_e2e_api_suite.py \
            -v --tb=short
